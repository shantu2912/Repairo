<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Account Settings · FixZenix</title>
<meta name="theme-color" content="#5D5646">

<!-- Typography & Styles -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
  [x-cloak] { display: none !important; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #EEEAE2; color: #2D2B28; }
  .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); }
  .gradient-text { background: linear-gradient(135deg, #A07D54 0%, #5D5646 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .gradient-btn { background: linear-gradient(135deg, #5D5646 0%, #A07D54 100%); }
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 relative" x-data="profileApp()" x-init="init()">

  <!-- Top Navigation Header -->
  <header class="fixed top-0 left-0 right-0 z-50 p-4 max-w-md mx-auto flex items-center justify-between">
    <a href="index.html" class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-full shadow-md flex items-center justify-center text-gray-700 hover:text-black hover:scale-105 transition-all">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <span class="font-serif italic font-extrabold text-xl gradient-text">FixZenix</span>
    <div class="w-10"></div>
  </header>

  <!-- Profile Card Container -->
  <main class="w-full max-w-md glass-card rounded-[2.5rem] shadow-2xl border border-white p-6 relative overflow-hidden my-16">

    <!-- Loading Skeleton -->
    <div x-show="loading" class="py-16 text-center">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-[#A07D54] mb-3"></i>
      <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Loading Your Profile...</p>
    </div>

    <!-- Main Profile Content -->
    <div x-show="!loading" x-cloak>
      
      <!-- Avatar & Account Status Header -->
      <div class="text-center mb-6">
        <div class="relative w-24 h-24 mx-auto mb-3">
          <div class="w-24 h-24 rounded-full bg-gradient-to-br from-[#5D5646] to-[#A07D54] text-white font-extrabold text-3xl flex items-center justify-center border-4 border-white shadow-xl overflow-hidden">
            <span x-text="getInitials(form.full_name)">TK</span>
          </div>
          <div class="absolute bottom-0 right-0 w-7 h-7 bg-emerald-500 border-2 border-white rounded-full flex items-center justify-center shadow-md">
            <i class="fa-solid fa-shield-check text-white text-xs"></i>
          </div>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-900" x-text="form.full_name || 'Valued User'"></h1>
        <p class="text-xs font-mono font-bold text-[#A07D54] mt-0.5" x-text="'@' + (form.username || 'username')"></p>
        
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-[#EEEAE2] rounded-full mt-2 text-[10px] font-bold text-gray-600">
          <i class="fa-regular fa-calendar-check text-[#A07D54]"></i>
          <span>Member Since <span x-text="formatDate(createdAt)"></span></span>
        </div>
      </div>

      <!-- User Information Form -->
      <form @submit.prevent="saveProfile()" class="space-y-4">

        <!-- Full Name -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">Full Name</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" x-model="form.full_name" required placeholder="Full Name"
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#A07D54]">
          </div>
        </div>

        <!-- Username (Immutable Read-Only) -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">Username (Protected)</label>
          <div class="relative">
            <i class="fa-solid fa-at absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" x-model="form.username" disabled
                   class="w-full pl-11 pr-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-sm font-semibold text-gray-500 cursor-not-allowed">
          </div>
        </div>

        <!-- Mobile Number -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">Mobile Number</label>
          <div class="relative">
            <i class="fa-solid fa-mobile-screen absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="tel" x-model="form.mobile" required placeholder="10-digit Phone"
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#A07D54]">
          </div>
        </div>

        <!-- Birthplace / Hometown -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">City / Birthplace</label>
          <div class="relative">
            <i class="fa-solid fa-city absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" x-model="form.birthplace" placeholder="City Name"
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#A07D54]">
          </div>
        </div>

        <!-- Security Recovery Phrase / Secret -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">Security Hint / Secret</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" x-model="form.secret" placeholder="Secret Recovery Phrase"
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#A07D54]">
          </div>
        </div>

        <!-- Password Field with Visibility Toggle -->
        <div>
          <label class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1">Account Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input :type="showPassword ? 'text' : 'password'" x-model="form.password" placeholder="Password"
                   class="w-full pl-11 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#A07D54]">
            <button type="button" @click="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" :disabled="saving"
                class="w-full py-4 mt-6 rounded-2xl gradient-btn text-white font-extrabold text-xs uppercase tracking-widest shadow-xl hover:opacity-95 active:scale-95 transition-all flex items-center justify-center gap-2">
          <span x-show="!saving"><i class="fa-solid fa-floppy-disk mr-1"></i> Save Profile Details</span>
          <span x-show="saving"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Saving Changes...</span>
        </button>

      </form>

      <!-- Danger Zone / Log Out Button -->
      <div class="mt-8 pt-4 border-t border-gray-200">
        <button @click="logout()" class="w-full py-3 rounded-xl bg-red-50 text-red-600 font-bold text-xs uppercase tracking-widest hover:bg-red-100 transition-all flex items-center justify-center gap-2 border border-red-200">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out of Account
        </button>
      </div>

    </div>

  </main>

  <script src="profile.js"></script>
</body>
</html>
