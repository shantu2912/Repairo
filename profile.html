<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profile Settings · FixZenix</title>
<meta name="theme-color" content="#5D5646">

<!-- Fonts & Frameworks -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
  [x-cloak] { display: none !important; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #EEEAE2;
    color: #2D2B28;
  }
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 relative" x-data="profileApp()" x-init="init()">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-md flex items-center justify-between my-4">
    <a href="index.html" class="w-10 h-10 bg-white rounded-full shadow-sm border border-gray-200 flex items-center justify-center text-gray-700 hover:text-black hover:scale-105 active:scale-95 transition-all">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>
    <span class="font-serif italic font-extrabold text-xl text-[#5D5646]">FixZenix Profile</span>
    <button @click="logout()" class="w-10 h-10 bg-white rounded-full shadow-sm border border-red-200 flex items-center justify-center text-red-500 hover:bg-red-50 active:scale-95 transition-all" title="Log Out">
      <i class="fa-solid fa-right-from-bracket text-sm"></i>
    </button>
  </header>

  <!-- Profile Card Container -->
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-200 p-6 relative overflow-hidden mb-12">

    <!-- Loading Spinner -->
    <div x-show="loading" class="py-16 text-center">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-[#A07D54] mb-3"></i>
      <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Loading Profile...</p>
    </div>

    <!-- Main Form Content -->
    <div x-show="!loading" x-cloak>

      <!-- Avatar & User Info Header -->
      <div class="text-center mb-6">
        <div class="relative w-20 h-20 mx-auto mb-3">
          <div class="w-20 h-20 rounded-full bg-[#5D5646] text-white font-extrabold text-2xl flex items-center justify-center shadow-md">
            <span x-text="getInitials(form.full_name)">FX</span>
          </div>
          <div class="absolute bottom-0 right-0 w-6 h-6 bg-emerald-500 border-2 border-white rounded-full flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-check text-white text-[10px]"></i>
          </div>
        </div>

        <h1 class="text-xl font-extrabold text-gray-900" x-text="form.full_name || 'Customer Profile'"></h1>
        <p class="text-xs font-bold text-[#A07D54] mt-0.5" x-text="'@' + (form.username || 'user')"></p>
        <p class="text-[11px] font-medium text-gray-400 mt-1">
          Member Since <span class="font-bold text-gray-600" x-text="formatDate(createdAt)"></span>
        </p>
      </div>

      <!-- Tab Buttons -->
      <div class="grid grid-cols-2 p-1 bg-gray-100 rounded-2xl border border-gray-200 mb-6 text-xs font-bold">
        <button type="button" @click="activeTab = 'personal'" 
                :class="activeTab === 'personal' ? 'bg-white text-[#5D5646] shadow-sm' : 'text-gray-500 hover:text-gray-900'"
                class="py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-user"></i> Account
        </button>
        <button type="button" @click="activeTab = 'location'" 
                :class="activeTab === 'location' ? 'bg-white text-[#5D5646] shadow-sm' : 'text-gray-500 hover:text-gray-900'"
                class="py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-location-dot"></i> Address & GPS
        </button>
      </div>

      <!-- Form Body -->
      <form @submit.prevent="saveProfile()" class="space-y-4">

        <!-- TAB 1: ACCOUNT DETAILS -->
        <div x-show="activeTab === 'personal'" class="space-y-4" x-transition.opacity>
          
          <!-- Full Name -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Full Name</label>
            <div class="relative">
              <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="text" x-model="form.full_name" required placeholder="Your full name"
                     class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#A07D54] focus:border-transparent transition-all">
            </div>
          </div>

          <!-- Username (Protected) -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1">Username (Read-Only)</label>
            <div class="relative">
              <i class="fa-solid fa-at absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="text" x-model="form.username" disabled
                     class="w-full pl-11 pr-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-sm font-mono font-bold text-gray-500 cursor-not-allowed">
            </div>
          </div>

          <!-- Phone Number -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Mobile Phone</label>
            <div class="relative">
              <i class="fa-solid fa-mobile-screen absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="tel" x-model="form.phone" required placeholder="10-digit phone number"
                     class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#A07D54] focus:border-transparent transition-all">
            </div>
          </div>

          <!-- Language Selection -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Preferred Language</label>
            <div class="grid grid-cols-3 gap-2">
              <template x-for="lang in ['English', 'Hindi', 'Marathi']" :key="lang">
                <button type="button" @click="form.preferred_lang = lang"
                        :class="form.preferred_lang === lang ? 'bg-[#5D5646] text-white border-[#5D5646]' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'"
                        class="py-2 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-1">
                  <i x-show="form.preferred_lang === lang" class="fa-solid fa-check text-[10px]"></i>
                  <span x-text="lang"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- Password / Hash -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Password</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input :type="showPassword ? 'text' : 'password'" x-model="form.password_hash" placeholder="Enter password"
                     class="w-full pl-11 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#A07D54] focus:border-transparent transition-all">
              <button type="button" @click="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">
                <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

        </div>

        <!-- TAB 2: ADDRESS & LOCATION -->
        <div x-show="activeTab === 'location'" class="space-y-4" x-transition.opacity x-cloak>
          
          <!-- Doorstep Address -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Home Address</label>
            <div class="relative">
              <i class="fa-solid fa-house absolute left-4 top-4 text-gray-400 text-sm"></i>
              <textarea x-model="form.address" rows="3" placeholder="Flat / House No, Street, Landmark"
                        class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#A07D54] focus:border-transparent transition-all resize-none"></textarea>
            </div>
          </div>

          <!-- GPS Coordinates Box -->
          <div class="p-4 rounded-xl bg-gray-50 border border-gray-200 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-gray-700 flex items-center gap-1.5">
                <i class="fa-solid fa-crosshairs text-[#A07D54]"></i> GPS Location
              </span>
              <button type="button" @click="detectGPS()" :disabled="locating"
                      class="px-3 py-1 bg-[#A07D54] text-white hover:bg-[#5D5646] rounded-lg text-[11px] font-bold transition-all flex items-center gap-1 shadow-sm">
                <i class="fa-solid" :class="locating ? 'fa-spinner fa-spin' : 'fa-location-arrow'"></i>
                <span x-text="locating ? 'Locating...' : 'Auto Detect'"></span>
              </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[9px] font-bold uppercase text-gray-400 mb-1">Latitude</label>
                <input type="text" x-model="form.latitude" readonly placeholder="0.000000"
                       class="w-full px-3 py-2 bg-gray-200/60 border border-gray-200 rounded-lg text-xs font-mono font-semibold text-gray-600">
              </div>
              <div>
                <label class="block text-[9px] font-bold uppercase text-gray-400 mb-1">Longitude</label>
                <input type="text" x-model="form.longitude" readonly placeholder="0.000000"
                       class="w-full px-3 py-2 bg-gray-200/60 border border-gray-200 rounded-lg text-xs font-mono font-semibold text-gray-600">
              </div>
            </div>
          </div>

        </div>

        <!-- Save Button -->
        <button type="submit" :disabled="saving"
                class="w-full py-3.5 mt-6 rounded-xl bg-[#5D5646] hover:bg-[#4A4436] text-white font-bold text-sm uppercase tracking-wider shadow-md active:scale-98 transition-all flex items-center justify-center gap-2">
          <span x-show="!saving"><i class="fa-solid fa-floppy-disk"></i> Save Profile</span>
          <span x-show="saving"><i class="fa-solid fa-circle-notch fa-spin"></i> Saving...</span>
        </button>

      </form>

    </div>

  </main>

  <script src="profile.js"></script>
</body>
</html>
